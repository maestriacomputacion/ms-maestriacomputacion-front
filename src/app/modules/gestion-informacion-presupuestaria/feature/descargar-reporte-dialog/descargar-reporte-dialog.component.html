<p-dialog
    header="Descargar Reporte"
    [(visible)]="display"
    [modal]="true"
    [style]="{ width: '480px', 'min-width': '320px', 'border-radius': '28px' }"
    [draggable]="false"
    [resizable]="false"
    (onShow)="onDialogShow()"
    (onHide)="cerrar()"
    [closable]="true">

    <!-- Título del diálogo con estilo institucional -->
    <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2">
            <span class="material-symbols-rounded" style="font-size: 24px; color: #000066;" aria-hidden="true">download</span>
            <span style="font-family: 'Titillium Web', sans-serif; font-size: 18px; color: #000066; font-weight: 700;">
                Descargar Reporte
            </span>
        </div>
    </ng-template>

    <div class="grid p-fluid mt-2">

        <!-- Selector de Tipo de Reporte -->
        <div class="col-12 mb-4">
            <label for="dropdown-report" class="campo-label mb-2 block">Tipo de Reporte</label>
            <p-dropdown
                [options]="reportOptions"
                [(ngModel)]="selectedReport"
                optionLabel="name"
                optionValue="value"
                appendTo="body"
                inputId="dropdown-report"
                placeholder="Seleccione un tipo de reporte"
                styleClass="w-full"
                aria-label="Tipo de reporte"
                (onChange)="onReportChange()">
            </p-dropdown>
        </div>

        <!-- Selector de Período Académico -->
        <div class="col-12 mb-2">
            <label for="dropdown-period" class="campo-label mb-2 block">Período Académico</label>
            <p-dropdown
                [options]="periodOptions"
                [(ngModel)]="selectedPeriodKey"
                optionLabel="name"
                optionValue="value"
                appendTo="body"
                inputId="dropdown-period"
                placeholder="Seleccione un período"
                styleClass="w-full"
                aria-label="Período académico"
                [disabled]="!selectedReport || periodOptions.length === 0 || selectedReport === 'proyeccion-reporte'">
            </p-dropdown>
            <small *ngIf="selectedReport === 'proyeccion-reporte'"
                style="font-family: 'Open Sans', sans-serif; font-size: 12px; color: #777680; display: block; margin-top: 4px;">
                La proyección corresponde siempre al período en curso.
            </small>
        </div>
    </div>

    <!-- Footer con botones -->
    <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
            <button pButton pRipple type="button"
                label="Cancelar"
                class="p-button-rounded p-button-outlined btn-cancelar"
                aria-label="Cancelar descarga"
                (click)="cerrar()"
                [disabled]="loadingDownload">
                <span class="material-symbols-rounded mr-2" style="font-size: 16px;" aria-hidden="true">close</span>
            </button>
            <button pButton pRipple type="button"
                [label]="loadingDownload ? 'Generando...' : 'Descargar'"
                class="p-button-rounded btn-descargar"
                aria-label="Descargar reporte"
                (click)="descargar()"
                [disabled]="!selectedReport || !selectedPeriodKey || loadingDownload">
                <span *ngIf="!loadingDownload" class="material-symbols-rounded mr-2" style="font-size: 16px;" aria-hidden="true">download</span>
                <span *ngIf="loadingDownload" class="pi pi-spin pi-spinner mr-2" aria-hidden="true"></span>
            </button>
        </div>
    </ng-template>
</p-dialog>
