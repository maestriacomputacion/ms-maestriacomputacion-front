<div class="surface-0 p-4">
    <p-toast position="top-right" styleClass="uni-toast"></p-toast>

    <!-- Navegación por pestañas -->
    <app-opciones-presupuesto
        [activeTab]="'proyeccion-reporte'"
        [currentPeriod]="periodoSeleccionado"
        (onDescargar)="descargar()"
        (onProyectarPresupuesto)="abrirDialogoProyectar()">
    </app-opciones-presupuesto>

    <!-- Selector de Período -->
    <div class="flex justify-content-center mb-4">
        <app-periodo-financiero-selector
            [modo]="'activos'"
            [mensajeVacio]="'No hay períodos académicos activos para mostrar.'"
            (periodoSeleccionado)="onPeriodoChange($event)"
            (sinPeriodosChange)="sinPeriodos = $event"
            (errorCargaChange)="errorPeriodos = $event">
        </app-periodo-financiero-selector>
    </div>

    <!-- Estado: Cargando -->
    <div *ngIf="cargando" class="mb-4">
        <app-uni-progress-bar label="Cargando proyección de estudiantes..."></app-uni-progress-bar>
    </div>

    <!-- Estado: Sin datos -->
    <app-estado-vacio
        *ngIf="!configuracion && !sinPeriodos && !errorPeriodos && !cargando"
        icono="inbox"
        mensaje="Seleccione un período académico para cargar la proyección.">
    </app-estado-vacio>

    <!-- Contenido -->
    <ng-container *ngIf="configuracion">

        <!-- Sección: Configuración editable -->
        <app-configuracion-proyeccion-card
            [configuracion]="configuracion"
            [isEditable]="esEditable"
            [disabled]="editingRowKey !== null"
            (save)="onConfigSave($event)">
        </app-configuracion-proyeccion-card>


        <!-- Título de sección institucional -->
        <div class="mb-2 px-1">
            <h2 class="text-xl font-semibold m-0" style="color: #000066; font-family: 'Titillium Web', sans-serif;">
                Proyección de Estudiantes
            </h2>
        </div>

        <app-tabla-estudiantes-reporte
            [estudiantes]="estudiantes"
            [configuracion]="configuracion"
            [editable]="true"
            [editingRowKey]="editingRowKey"
            (rowEditInit)="onRowEditInit($event)"
            (rowEditSave)="onRowEditSave($event)"
            (rowEditCancel)="onRowEditCancel($event.estudiante, $event.index)"
            (percentInput)="onPercentInput($event.event, $event.estudiante, $event.campo)">
        </app-tabla-estudiantes-reporte>

            <!-- Totales -->
            <div class="totales-container mt-3">
                <div class="total-item">
                    <span class="total-label">Total Neto:</span>
                    <span class="total-value">{{ totalNetoCalculado | formatCurrency }}</span>
                </div>
                <div class="total-item">
                    <span class="total-label">Total Descuentos:</span>
                    <span class="total-value">{{ totalDescuentosCalculado | formatCurrency }}</span>
                </div>
                <div class="total-item highlight">
                    <span class="total-label">Ingresos Totales Después de Descuentos:</span>
                    <span class="total-value">{{ totalIngresosCalculado | formatCurrency }}</span>
                </div>
            </div>
        
    </ng-container>

    <app-proyectar-presupuesto-dialog
        [(visible)]="displayProyectarDialog"
        [ultimoPeriodo]="periodoSeleccionado"
        (onProyectar)="proyectarPresupuesto($event)">
    </app-proyectar-presupuesto-dialog>
</div>
