<p-tabView *ngIf="areas?.length > 0" (onChange)="onTabChange($event)" styleClass="tabs-centrados">
    <p-tabPanel *ngFor="let area of areas" [header]="area.label">
        <div class="p-3" style="max-height: 600px; overflow-y: auto;">
            <div *ngIf="loadingCursosPorArea[area.value]" class="flex justify-content-center p-3">
                <p-progressSpinner></p-progressSpinner>
            </div>

            <div *ngIf="!loadingCursosPorArea[area.value]">
                <ng-container *ngIf="(cursosPorArea[area.value] || []).length; else sinCursos">
                    <ng-container *ngFor="let grupoAsig of cursosPorAreaAgrupados[area.value]">
                        <div class="surface-card border-round mb-4 shadow-2 border-1 border-300">
                            <div class="p-3 surface-100 border-round-top">
                                <div class="text-900 font-semibold text-lg">
                                    {{ grupoAsig.asignatura }}
                                </div>
                                <div class="text-500 text-sm">
                                    {{ grupoAsig.cursos.length }}
                                    grupo{{ grupoAsig.cursos.length > 1 ? "s" : "" }}
                                </div>
                            </div>
                            <p-table [value]="grupoAsig.cursos" styleClass="p-datatable-striped"
                                [responsiveLayout]="'scroll'" [tableStyle]="{'table-layout': 'fixed', 'width': '100%'}">
                                <ng-template pTemplate="header">
                                    <tr>
                                        <th scope="col" style="width: 15%;">Grupo</th>
                                        <th scope="col" style="width: 40%;">Docentes</th>
                                        <th scope="col" style="width: 25%;">Salón</th>
                                        <th scope="col" style="width: 20%;" class="text-center">
                                            Opciones
                                        </th>
                                    </tr>
                                </ng-template>
                                <ng-template pTemplate="body" let-item>
                                    <tr>
                                        <td style="width: 15%;">{{ item.grupo ?? "-" }}</td>
                                        <td
                                            style="width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                            {{ item.docente ?? "-" }}
                                        </td>
                                        <td
                                            style="width: 25%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                            {{ item.salon ?? "-" }}
                                        </td>
                                        <td style="width: 20%;" class="text-center">
                                            <button type="button" pButton pRipple label="Seleccionar"
                                                class="p-button-rounded p-button-text p-button-sm"
                                                (click)="onSeleccionarCurso($event, item, area)"></button>
                                        </td>
                                    </tr>
                                </ng-template>
                            </p-table>
                        </div>
                    </ng-container>
                </ng-container>
                <ng-template #sinCursos>
                    <div class="p-3 text-center">
                        No hay cursos para esta área
                    </div>
                </ng-template>
            </div>
        </div>
    </p-tabPanel>
</p-tabView>
