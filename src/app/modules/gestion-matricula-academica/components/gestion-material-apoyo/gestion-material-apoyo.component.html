<p-toast></p-toast>

<p-panel>
    <p-header>
        <b>GESTIONAR MATERIAL DE APOYO</b>
    </p-header>
    <div
        class="flex flex-column md:flex-row md:align-items-end md:justify-content-between gap-3 mb-3"
    >
        <div class="flex-1 min-w-0">
            <span class="p-input-icon-left w-full">
                <i class="pi pi-search"></i>
                <input
                    pInputText
                    placeholder="Ej: Guia de laboratorio"
                    type="text"
                    class="w-full"
                    placeholder="Ej: Guia de laboratorio"
                    (input)="
                        tableMaterialApoyo.filterGlobal(
                            $event.target.value,
                            'contains'
                        )
                    "
                />
            </span>
        </div>
        <div class="flex md:justify-content-end">
            <button
                pButton
                pRipple
                label="Registrar Material"
                class="p-button-primary p-button-sm"
                (click)="showDialog()"
            ></button>
        </div>
    </div>
    <p-table
        #tableMaterialApoyo
        [value]="materialesApoyo"
        [paginator]="true"
        [loading]="loading"
        [rows]="10"
        breakpoint="768px"
        styleClass="p-datatable-gridlines p-datatable-striped"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} materiales"
        [globalFilterFields]="['nombre', 'descripcion']"
        [sortField]="'nombre'"
        [sortOrder]="1"
    >
        <ng-template pTemplate="header">
            <tr>
                <th scope="col" class="text-center w-1">No.</th>
                <th pSortableColumn="nombre" scope="col">
                    Nombre del Material de Apoyo
                    <p-sortIcon field="nombre"></p-sortIcon>
                </th>
                <th scope="col" class="text-center w-3">Acción</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-material let-rowIndex="rowIndex">
            <tr>
                <td class="text-center">{{ rowIndex + 1 }}</td>
                <td>{{ material.nombre }}</td>
                <td class="text-center">
                    <button
                        pButton
                        pRipple
                        pTooltip="Ver Material"
                        type="button"
                        icon="pi pi-external-link"
                        class="p-button-rounded p-button-text p-button-sm p-button-info"
                        (click)="abrirEnlace(material.enlace)"
                    ></button>
                    <button
                        pButton
                        pRipple
                        pTooltip="Editar"
                        type="button"
                        icon="pi pi-pencil"
                        class="p-button-rounded p-button-text p-button-sm p-button-warning"
                        (click)="onEditar(material.id)"
                    ></button>
                    <button
                        pButton
                        pRipple
                        pTooltip="Eliminar"
                        type="button"
                        icon="pi pi-trash"
                        class="p-button-rounded p-button-text p-button-sm p-button-danger"
                        (click)="onDelete($event, material.id)"
                    ></button>
                    <p-confirmPopup></p-confirmPopup>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage" let-columns>
            <tr>
                <td [attr.colspan]="3">No se encontraron registros</td>
            </tr>
        </ng-template>
    </p-table>

    <p-footer></p-footer>
</p-panel>

<p-dialog
    header="{{
        isNewMaterial
            ? 'Registrar Material de Apoyo'
            : 'Editar Material de Apoyo'
    }}"
    [(visible)]="displayDialog"
    [modal]="true"
    [closable]="false"
    [responsive]="true"
    styleClass="w-full md:w-30rem lg:w-40rem"
    [breakpoint]="768"
>
    <div class="p-fluid">
        <div class="field">
            <label for="nombre" class="label-required"
                >Nombre del Material:
            </label>
            <input
                id="nombre"
                name="nombre"
                type="text"
                pInputText
                placeholder="Ej: Guia de laboratorio"
                [(ngModel)]="materialApoyo.nombre"
                #nombreCtrl="ngModel"
                [class.p-invalid]="
                    nombreCtrl.invalid && (nombreCtrl.touched || submitted)
                "
                aria-required="true"
                [attr.aria-invalid]="
                    nombreCtrl.invalid && (nombreCtrl.touched || submitted)
                "
            />
            <small
                *ngIf="nombreCtrl.invalid && (nombreCtrl.touched || submitted)"
                class="p-error"
            >
                El nombre es requerido
            </small>
        </div>
        <div class="field">
            <label for="descripcion">Descripción</label>
            <textarea
                id="descripcion"
                pInputTextarea
                [(ngModel)]="materialApoyo.descripcion"
                (ngModelChange)="onDescripcionChange($event)"
                (paste)="onDescripcionPaste($event)"
                [rows]="3"
                placeholder="Ej: Documento PDF del curso"
                maxlength="255"
                aria-describedby="descCounter"
                [attr.aria-invalid]="descriptionLength > MAX_DESCRIPTION"
            ></textarea>
            <div class="flex justify-content-between">
                <small class="text-muted">Opcional</small>
                <small
                    id="descCounter"
                    [ngClass]="{
                        'p-error': descriptionLength > MAX_DESCRIPTION
                    }"
                    >{{ descriptionLength }} / {{ MAX_DESCRIPTION }}</small
                >
            </div>
        </div>
        <div class="field">
            <label for="enlace" class="label-required"
                >Enlace al Material de Apoyo:
            </label>
            <input
                id="enlace"
                name="enlace"
                type="url"
                pInputText
                [(ngModel)]="materialApoyo.enlace"
                #enlaceCtrl="ngModel"
                [class.p-invalid]="
                    enlaceCtrl.invalid && (enlaceCtrl.touched || submitted)
                "
                aria-required="true"
                [attr.aria-invalid]="
                    enlaceCtrl.invalid && (enlaceCtrl.touched || submitted)
                "
                placeholder="https://ejemplo.com/documento.pdf"
            />
            <small
                *ngIf="enlaceCtrl.invalid && (enlaceCtrl.touched || submitted)"
                class="p-error"
            >
                El enlace es requerido
            </small>
        </div>
    </div>
    <p-footer>
        <button
            pButton
            pRipple
            label="Cancelar"
            icon="pi pi-times"
            class="p-button-secondary p-button-outlined"
            (click)="onCancel()"
        ></button>
        <button
            pButton
            pRipple
            label="Guardar"
            icon="pi pi-check"
            class="p-button-primary"
            [disabled]="!materialApoyo.nombre || !materialApoyo.enlace"
            (click)="onSave()"
        ></button>
    </p-footer>
</p-dialog>
