<p-panel>
    <p-header>
        <b>REPORTE PARA EL CENTRO DE POSTGRADOS</b>
    </p-header>

    <div class="flex flex-column gap-3">
        <div class="flex align-items-center gap-2">
            <i class="pi pi-download text-primary text-lg"></i>
            <span class="text-600"
                >Selecciona un período finalizado y descarga el reporte en
                Excel.</span
            >
        </div>

        <div class="flex align-items-center gap-3">
            <p-dropdown
                [options]="periodos"
                [(ngModel)]="periodoSeleccionado"
                optionLabel="descripcion"
                placeholder="Selecciona un período"
                [disabled]="cargando"
                styleClass="w-20rem"
                [style]="{ minWidth: '300px' }"
            >
                <ng-template let-periodo pTemplate="item">
                    <span
                        >{{ periodo.anio }}-{{ periodo.tagPeriodo }} —
                        {{ periodo.descripcion }}</span
                    >
                </ng-template>
                <ng-template let-periodo pTemplate="selectedItem">
                    <span
                        >{{ periodo.anio }}-{{ periodo.tagPeriodo }} —
                        {{ periodo.descripcion }}</span
                    >
                </ng-template>
            </p-dropdown>

            <button
                pButton
                pRipple
                type="button"
                label="Descargar reporte"
                icon="pi pi-download"
                class="p-button-primary"
                [disabled]="!periodoSeleccionado"
                [loading]="descargando"
                (click)="descargarReporte()"
            ></button>
        </div>
    </div>
</p-panel>
