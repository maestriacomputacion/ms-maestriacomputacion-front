<p-panel>
    <p-header>
        <b>TIPO DE NOTIFICACIÓN</b>
    </p-header>

    <div class="surface-card border-1 border-200 border-round p-4">
        <div class="grid">
            <div class="col-12 md:col-6" *ngFor="let tipo of tipos">
                <div
                    class="border-1 border-200 border-round p-3 flex flex-column gap-2 h-full"
                >
                    <div class="flex align-items-center gap-2">
                        <i [class]="tipo.icon + ' text-primary'"></i>
                        <div class="font-semibold text-900">
                            {{ tipo.label }}
                        </div>
                    </div>
                    <div class="text-600">{{ tipo.descripcion }}</div>
                    <div class="flex justify-content-end">
                        <button
                            pButton
                            pRipple
                            label="Ir"
                            class="p-button-primary p-button-sm"
                            icon="pi pi-arrow-right"
                            [routerLink]="tipo.ruta"
                        ></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</p-panel>
