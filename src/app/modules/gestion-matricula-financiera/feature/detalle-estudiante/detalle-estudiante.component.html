<p-toast></p-toast>
<div class="col-12">
    <p-card>

        <!-- Contenido Principal -->
        <ng-container *ngIf="vm$ | async as vm">
            <div *ngIf="vm.estudiante">

                <!-- Botón volver (arriba a la izquierda, como en la versión con lineamientos) -->
                <button pButton pRipple
                    type="button"
                    label="Volver al listado"
                    icon="pi pi-arrow-left"
                    class="p-button-text p-button-rounded mb-3"
                    (click)="volver()">
                </button>

                <!-- Header: Título + Periodo Académico (a la derecha) -->
                <div class="flex flex-column md:flex-row align-items-start md:align-items-center justify-content-between gap-3 mb-4 pb-3 border-bottom-1 surface-border">
                    <div>
                        <h2 class="m-0 text-700">Detalles de Matrícula</h2>
                        <span class="text-500 text-sm">Información completa del estudiante</span>
                    </div>
                    <div *ngIf="getPeriodoLabel(vm.periodo, vm.periodos) as periodoLabel" class="text-right">
                        <p-tag severity="info" [value]="periodoLabel" icon="pi pi-calendar"
                               pTooltip="Período académico al que pertenece el detalle."></p-tag>
                        <div class="text-500 text-xs mt-1">Periodo Académico</div>
                    </div>
                </div>

                <!-- Tabla Compartida de Matrícula -->
                <app-tabla-matricula-estudiante [estudiante]="vm.estudiante"></app-tabla-matricula-estudiante>

            </div>

            <!-- Estado vacío si no se encontró el estudiante -->
            <div *ngIf="!vm.estudiante">
                <div class="flex flex-column align-items-center justify-content-center py-8 text-400">
                    <i class="pi pi-exclamation-triangle text-5xl mb-3 text-yellow-500"></i>
                    <span class="text-lg font-medium text-700">No se encontró la información del estudiante</span>
                    <span class="text-sm mt-1 mb-4">El registro solicitado no está disponible</span>
                    <button pButton pRipple
                        type="button"
                        label="Volver al listado"
                        icon="pi pi-arrow-left"
                        class="p-button-outlined"
                        (click)="volver()">
                    </button>
                </div>
            </div>
        </ng-container>

    </p-card>
</div>
